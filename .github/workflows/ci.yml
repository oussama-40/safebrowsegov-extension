name: SafeBrowseGov CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test and Validate Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('data/rules.json'))"
          node -e "JSON.parse(require('fs').readFileSync('data/confusables.json'))"
          node -e "JSON.parse(require('fs').readFileSync('rules/ad-blocking-rules.json'))"

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test
